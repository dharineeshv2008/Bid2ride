name: Bid2Ride Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: bid2ride_user
          POSTGRES_PASSWORD: bid2ride_password
          POSTGRES_DB: bid2ride_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black pytest pytest-asyncio httpx
        pip install -r backend/requirements.txt

    - name: Verify code formatting with Black
      run: black --check backend

    - name: Verify linting with Ruff
      run: ruff check backend

    - name: Run Test Suites with Pytest
      env:
        ENVIRONMENT: testing
        POSTGRES_SERVER: localhost
        POSTGRES_USER: bid2ride_user
        POSTGRES_PASSWORD: bid2ride_password
        POSTGRES_DB: bid2ride_db
        REDIS_HOST=localhost
      run: |
        pytest backend/tests/ --maxfail=1 --disable-warnings

    - name: Verify Docker Container Build
      run: |
        docker build -t bid2ride-web-test ./backend
