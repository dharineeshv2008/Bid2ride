name: Bid2Ride Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Python Backend Tests & Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: bid2ride_user
          POSTGRES_PASSWORD: bid2ride_password
          POSTGRES_DB: bid2ride_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black pytest pytest-asyncio pytest-cov httpx
        pip install -r backend/requirements.txt

    - name: Check Code Formatting (Black)
      run: black --check backend

    - name: Check Linting (Ruff)
      run: ruff check backend

    - name: Run Pytest Suite with Coverage
      env:
        ENVIRONMENT: testing
        POSTGRES_SERVER: localhost
        POSTGRES_USER: bid2ride_user
        POSTGRES_PASSWORD: bid2ride_password
        POSTGRES_DB: bid2ride_db
        REDIS_HOST: localhost
        SECRET_KEY: ci_secret_key_testing_only
      run: |
        pytest backend/tests/ --cov=backend/app --cov-report=xml --disable-warnings

    - name: Build Backend Docker Container
      run: |
        docker build -t bid2ride-backend:latest ./backend

  frontend-build:
    name: Frontend Workspaces Typecheck & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    - name: Install NPM Dependencies across Workspaces
      run: npm ci || npm install

    - name: Build All Workspaces
      run: npm run build
